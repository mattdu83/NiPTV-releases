# Diagnostic sur un vrai Mac (gratuit ici) : lit une video avec NiPTV en mode test
# (--test-video), enregistre l'image recue et le journal de libVLC. Rien n'est publie.
name: Test Mac

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou branche du code"
        default: main
      url:
        description: "Video a lire (ass : fichier d'essai avec deux pistes ASS)"
        default: https://github.com/ietf-wg-cellar/matroska-test-files/raw/master/test_files/test5.mkv
      subtitles:
        description: "piste, piste2… (sous-titres du fichier), ou vide"
        default: piste

env:
  CODE_REPO: NicolasLambard/NiPTV-FireTV

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.CODE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CODE_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: libVLC
        run: |
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 -o vlc.dmg https://get.videolan.org/vlc/3.0.21/macosx/vlc-3.0.21-universal.dmg
          hdiutil attach vlc.dmg -nobrowse -readonly -mountpoint /tmp/vlc
          mkdir -p composeApp/resources/macos/vlc
          cp -R /tmp/vlc/VLC.app/Contents/MacOS/lib composeApp/resources/macos/vlc/
          cp -R /tmp/vlc/VLC.app/Contents/MacOS/plugins composeApp/resources/macos/vlc/
          hdiutil detach /tmp/vlc
          find composeApp/resources/macos/vlc/plugins -name 'plugins.dat' -delete

      - name: Construction
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:createDistributable --console=plain -q

      - name: Fichier d'essai ASS (si url = ass)
        if: inputs.url == 'ass'
        run: |
          python3 -m pip install --quiet --break-system-packages imageio-ffmpeg
          FFMPEG=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          for f in Arial PoliceInexistanteXYZ; do
            cat > "$f.ass" <<ASS
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1280
          PlayResY: 720

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,$f,60,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,3,0,2,10,10,40,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,0:00:00.00,0:01:00.00,Default,,0,0,0,,POLICE $f éàç
          ASS
            sed -i '' 's/^          //' "$f.ass"
          done
          "$FFMPEG" -loglevel error -f lavfi -i testsrc=size=1280x720:rate=25 -t 30 -i Arial.ass -i PoliceInexistanteXYZ.ass             -map 0 -map 1 -map 2 -c:v libx264 -c:s ass -metadata:s:s:0 language=eng -metadata:s:s:1 language=fre "$PWD/essai.mkv"
          echo "VIDEO=file://$PWD/essai.mkv" >> $GITHUB_ENV

      - name: Lecture
        run: |
          mkdir -p out
          APP=$(find composeApp/build/compose/binaries/main/app -maxdepth 1 -name '*.app' | head -1)
          JAVA_TOOL_OPTIONS=-Dniptv.vlcverbose=1 "$APP/Contents/MacOS/NiPTV" --test-video "${VIDEO:-${{ inputs.url }}}" "$PWD/out/image.png" ${{ inputs.subtitles }} > out/journal.txt 2>&1 || true
          grep -v '^\[h264 @' out/journal.txt | grep -i -E 'sous-titres|image|spu|subtit|blend|freetype|text|font|error' | head -80

      - uses: actions/upload-artifact@v5
        with:
          name: test-mac
          path: out/
